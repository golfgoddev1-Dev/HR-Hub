name = "hr-hub-api"
main = "src/index.js"
workers_dev = false
preview_urls = false

# At least one month old at time of writing (2026-10-30).
compatibility_date = "2026-09-01"

# Workers Free allows 5 cron triggers per account. Deployed set:
#   0 1,9,17 * * *   keep-alive (Phase 4b), 00:00 / 08:00 / 16:00 Asia/Bangkok
#   0 2 * * *        leave certificate retention (phase 2), 09:00 Asia/Bangkok
#   * * * * *        web push queue fallback (every minute) + opt-in auto-absent
#
# Auto-absent shares the every-minute expression but is off by default. It runs
# only when AUTO_ABSENT_ENABLED is exactly "true"; the push fallback runs on the
# same tick regardless. The expected list is pinned by
# tests/wrangler-crons.test.js.
[triggers]
crons = ["0 1,9,17 * * *", "0 2 * * *", "* * * * *"]

# Rate limiters: SQLite-backed Durable Objects. Workers Free only supports the
# SQLite storage backend, confirmed at
# https://developers.cloudflare.com/durable-objects/platform/pricing
[[durable_objects.bindings]]
name = "RL_CONTEXT_IP"
class_name = "ContextRateLimiter"

[[durable_objects.bindings]]
name = "RL_SUBMIT_IP"
class_name = "SubmitIpRateLimiter"

[[durable_objects.bindings]]
name = "RL_SUBMIT_TOKEN"
class_name = "SubmitTokenRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = [
  "ContextRateLimiter",
  "SubmitIpRateLimiter",
  "SubmitTokenRateLimiter",
]

[vars]
APP_ORIGIN = "https://hr-hub-3yr.pages.dev"
# Public frontend origin used to build the approval email link. Plain config,
# not a secret; it is never derived from a request header.
APP_PUBLIC_URL = "https://hr-hub-3yr.pages.dev"
# AUTO_ABSENT_ENABLED is intentionally not set: auto-absent is off by default.
# The owner turns it on deliberately by adding it here with the value "true"
# (the exact string; anything else, including "false", keeps it off), then
# deploying. It is a separate decision from the every-minute push fallback.