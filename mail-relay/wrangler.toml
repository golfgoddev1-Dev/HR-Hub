# Mail relay Worker. A separate deployment so the provider API key never lives
# in the API Worker.
#
# Secrets — set with `npx wrangler secret put <NAME>` in mail-relay/, never in
# this file and never in the repository:
#   MAIL_RELAY_SECRET  shared secret; the API Worker sends it as
#                      `Authorization: Bearer <value>` and nothing else may call
#   RESEND_API_KEY     provider key; only this Worker holds it
#
# MAIL_FROM is a plain variable, set at deploy time to a sender whose domain is
# verified with the provider (for example "HR Hub <no-reply@<verified-domain>>"):
#   npx wrangler deploy --var MAIL_FROM:"HR Hub <no-reply@<verified-domain>>"
#
# The endpoint is reachable on workers.dev but every request still needs the
# shared secret, and the accepted message is plain text only.

name = "hr-hub-mail-relay"
main = "src/index.js"
workers_dev = true
preview_urls = false

compatibility_date = "2026-09-01"
